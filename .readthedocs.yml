version: 2

build:
   os: ubuntu-22.04
   tools:
      python: "3.11"
   apt_packages:
      - pkg-config
      - automake
      - libtool

python:
   install:
      - requirements: doc/requirements-rtd.txt
      - method: pip
        path: .

sphinx:
   configuration: doc/conf.py

submodules:
    include: all
